<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abby Katz</title>
  <style>
    :root {
      --green: #33ff66;
      --dim: #1f9e40;
      --bg: #000;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { background: var(--bg); }

    body {
      font-family: "DejaVu Sans Mono", "Menlo", "Consolas", "Courier New", monospace;
      font-size: 16px;
      line-height: 1.6;
      color: var(--green);
      text-shadow: 0 0 4px rgba(51, 255, 102, 0.55);
      min-height: 100vh;
      padding: 24px 16px;
    }

    /* faint CRT scanlines */
    body::after {
      content: "";
      pointer-events: none;
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0) 0,
        rgba(0, 0, 0, 0) 2px,
        rgba(0, 0, 0, 0.25) 3px
      );
    }

    main { max-width: 760px; }

    p { white-space: pre-wrap; }

    .dim { color: var(--dim); }

    .gap { height: 1.6em; }

    ul { list-style: none; }

    a {
      display: block;
      color: inherit;
      text-decoration: none;
      outline: none;
      padding: 0 1ch;
      margin: 0 -1ch;
    }

    a.selected {
      background: var(--green);
      color: var(--bg);
      text-shadow: none;
    }

    a::before { content: "  "; white-space: pre; }
    a.selected::before { content: "> "; }

    .cursor {
      display: inline-block;
      width: 1ch;
      height: 1.1em;
      vertical-align: text-bottom;
      background: var(--green);
      box-shadow: 0 0 4px rgba(51, 255, 102, 0.55);
      animation: blink 1s steps(1) infinite;
    }

    @keyframes blink { 50% { opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .cursor { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <p>Hi, I'm Abby. Welcome to my personal website!</p>
    <div class="gap"></div>

    <ul id="menu">
      <li><a href="https://github.com/abbykatz23" tabindex="-1" target="_blank" rel="noopener">GitHub</a></li>
      <li><a href="https://www.linkedin.com/in/abby-katz2023" tabindex="-1" target="_blank" rel="noopener">LinkedIn</a></li>
      <li><a href="https://open.spotify.com/show/6Dxks6Zao76IsLgBrapxdi" tabindex="-1" target="_blank" rel="noopener">Podcast</a></li>
      <li><a href="Abby_Katz_Resume.pdf" tabindex="-1" target="_blank" rel="noopener">Resume</a></li>
      <li><a href="https://makeatrain.netlify.app" tabindex="-1" target="_blank" rel="noopener">Make me a train..?</a></li>
      <li><a href="https://dockling.netlify.app" tabindex="-1" target="_blank" rel="noopener">Make claude a duck..?</a></li>
    </ul>

    <div class="gap"></div>
    <p class="dim">Use ↑/↓ to move, Enter to open.</p>
    <div class="gap"></div>
    <p>abby@web:~$ <span class="cursor"></span></p>
  </main>

  <script>
    const items = Array.from(document.querySelectorAll('#menu a'));

    function select(i) {
      items.forEach((a, j) => a.classList.toggle('selected', j === i));
      if (document.activeElement !== items[i]) items[i].focus({ preventScroll: true });
    }

    items.forEach((a, i) => {
      a.addEventListener('focus', () => select(i));
      a.addEventListener('mouseenter', () => select(i));
    });

    document.addEventListener('keydown', (e) => {
      const current = items.findIndex(a => a.classList.contains('selected'));
      if (e.key === 'Tab') {
        e.preventDefault();
        return;
      }
      let next = null;
      if (e.key === 'ArrowDown') next = current < 0 ? 0 : (current + 1) % items.length;
      if (e.key === 'ArrowUp')   next = current < 0 ? items.length - 1 : (current - 1 + items.length) % items.length;
      if (next !== null) {
        e.preventDefault();
        select(next);
      }
    });

    select(0);
  </script>
</body>
</html>
